<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LAB 7</title>
    <style>
      .field {
        margin-bottom: 20px;
      }
      .textbox-size textarea {
        width: 60%;
        height: 200px;
      }
    </style>
  </head>
  <body>
    <form action="/submit" method="post">
      <p>Enter your name:</p>
      <div class="field">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required />
      </div>
      <div class="field">
        <p>Enter your student ID:</p>
        <label for="stud_id">Student ID:</label>
        <input
          type="text"
          id="stud_id"
          name="stud_id"
          required
          pattern="[0-9]{2}-[0-9]{4}-[0-9]{3}"
          placeholder="e.g 26-4347-638"
          title="Format must be like this: 38-5467-672."
        />
      </div>
      <div class="field">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />
      </div>
      <div class="field">
        <p>Enter your password:</p>
        <label for="password">Password:</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          minlength="8"
          maxlength="96"
          pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).*"
          placeholder="e.g Akosipogi@2006"
          title="Must have at least 1 uppercase, 1 lowercase, 1 digit, and 1 special character."
        />
      </div>
      <div class="field">
        <p>Enter your birthdate:</p>
        <label for="birthday">Birthday:</label>
        <input
          type="date"
          id="birthday"
          name="birthday"
          required
          placeholder="11-01-2006"
        />
      </div>
      <div class="field">
        <label for="gender">Gender:</label>
        <select name="gender" id="gender">
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="none">Prefer not to say</option>
          <option value="blank" disabled selected>Select your gender</option>
        </select>
      </div>
      <div class="field">
        <p>Select your academic program:</p>
        <label for="BSIT">BSIT</label>
        <input type="radio" id="BSIT" name="program" required checked />
        <label for="BSCS">BSCS</label>
        <input type="radio" id="BSCS" name="program" required />
      </div>
      <div class="field">
        <p>Hobbies:</p>
        <label for="Coding">Coding</label>
        <input type="checkbox" id="Coding" name="hobbies" />
        <label for="Reading">Reading</label>
        <input type="checkbox" id="Reading" name="hobbies" />
        <label for="Writing">Writing</label>
        <input type="checkbox" id="Writing" name="hobbies" />
        <label for="Editing">Editing</label>
        <input type="checkbox" id="Editing" name="hobbies" />
        <label for="skills">Learning new skills</label>
        <input type="checkbox" id="skills" name="hobbies" />
      </div>
      <div class="field textbox-size">
        <label for="comment">Tell us more about yourself:</label><br />
        <textarea
          name="comment"
          id="comment"
          rows="5"
          cols="10"
          required.
          minlength="100"
          maxlength="300"
        ></textarea>
      </div>
      <div class="field">
        <label for="reset">Reset if you want to repeat again:</label>
        <button type="reset">Reset</button>
      </div>
      <div class="field">
        <input type="checkbox" id="terms" name="agree" required />
        <label for="terms">I agree to the terms and conditions.</label>
      </div>
      <div class="field"><button type="submit">Register</button></div>
    </form>
  </body>
</html>
