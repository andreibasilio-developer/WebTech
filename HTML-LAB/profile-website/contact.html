  <head>

  <header>
    <nav class="navigation">

      </ul>
    </nav>
  </header>
  <body>
    <h1>CONTACTS</h1>
    <img src="Me.png" alt="andrei" />
    <form action="">
      <div class="fills">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required />
      </div>
      <div class="fills">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />
      </div>
      <div class="fills">
        <label for="Password">Password:</label>
        <input
          type="password"
          id="password"
          name="password"
          minlength="8"
          maxlength="96"
          pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).*"
          placeholder="Akolangtoh@2006"
          title="The password must contain at least: 1 uppercase, 1 lowercase, 1 digit, and 1 special letter."
          required
        />
      </div>
      <div class="fills">
        <label for="subject">Subject (Optional):</label>
        <input type="text" id="subject" name="subject" />
      </div>
      <div class="fills text">
        <label for="message">Message:</label><br />
        <textarea name="message" id="message"></textarea>
      </div>
      <div>
        <label for="submit">Please click the submit button once done:</label>
      </div>
    </form>
  </body>
</html>
