<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMMET LAB 7</title>
    <style>
      nav ul {
        display: flex;
        gap: 20px;
      }
      #message {
        width: 60%;
        height: 150px;
      }
      .field {
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>MY PAGE</h1>
      <nav>
        <ul>
          <li><a href="#HOME">Home</a></li>
          <li><a href="#ABOUT">About</a></li>
          <li><a href="#SKILLS">Skills</a></li>
          <li><a href="#PROJECTS">Projects</a></li>
          <li><a href="#CONTACT">Contact</a></li>
        </ul>
      </nav>
      <p>Basilio, Andrei Kyle I.</p>
      <p>I am a 2nd year BSIT student who loves coding.</p>
    </header>
    <main>
      <section id="ABOUT"></section>
      <section id="SKILLS">
        <h2>SKILLS</h2>
        <ol>
          <li>Programming</li>
          <li>Reading</li>
          <li>Writing</li>
          <li>Problem Solving</li>
          <li>Thinking</li>
        </ol>
      </section>
      <section id="PROJECTS">
        <h2>PROJECTS</h2>
        <div class="cards"></div>
        <div class="cards"></div>
        <div class="cards"></div>
      </section>
      <section id="CONTACT">
        <h2>CONTACT</h2>
        <form action="/submit" method="post">
          <div class="field">
            <label for="name">Name:</label>
            <input type="text" name="name" id="name" required="required" />
          </div>
          <div class="field">
            <label for="email">Email:</label>
            <input type="email" name="email" id="email" required="required" />
          </div>
          <div class="field">
            <label for="subject">Subject:</label>
            <input type="text" name="subject" id="subject" />
          </div>
          <div class="field">
            <label for="message">Message:</label>
            <textarea
              name="message"
              id="message"
              minlength="30"
              maxlength="300"
              required>
            </textarea>
          </div>
        </form>
      </section>
    </main>
    <footer>
      <p>&copy; 2026 - Basilio, Andrei Kyle I. All rights reserved.</p>
    </footer>
  </body>
</html>
